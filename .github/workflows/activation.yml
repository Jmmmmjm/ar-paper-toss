name: Acquire Unity Activation File

on:
  workflow_dispatch:

jobs:
  activation:
    name: Request Unity License Activation File
    runs-on: macos-14
    steps:
      - name: Request Manual Activation File
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: 6000.1.6f1

      - name: Upload Manual Activation File
        uses: actions/upload-artifact@v4
        with:
          name: Unity_v6000.1.6f1.alf
          path: '**/*.alf'
