name: Acquire Unity Activation File

on:
  workflow_dispatch:

jobs:
  activation:
    name: Generate Unity .alf Activation File
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download & Install Unity 6000.1.6f1
        run: |
          # Install Unity 6 on macOS runner
          brew install --cask unity
          
      - name: Create Manual Activation File (.alf)
        run: |
          /Applications/Unity/Unity.app/Contents/MacOS/Unity -batchmode -nographics -createManualActivationFile -logfile /dev/stdout || true
          mkdir -p output
          find . -name "*.alf" -exec cp {} output/ \;

      - name: Upload .alf File Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unity_v6000.1.6f1.alf
          path: output/*.alf
          retention-days: 7
