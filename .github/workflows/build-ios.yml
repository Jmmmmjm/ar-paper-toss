name: Build iOS IPA

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS Application
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Select Xcode 16
        run: |
          XCODE_16_APP=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" | sort -V | tail -n 1)
          if [ -n "$XCODE_16_APP" ]; then
            echo "Selecting $XCODE_16_APP"
            sudo xcode-select -s "$XCODE_16_APP/Contents/Developer"
          fi
          xcodebuild -version

      - name: Install Unity 6 and iOS Build Support
        run: |
          brew install --cask unity-hub
          "/Applications/Unity Hub.app/Contents/MacOS/Unity Hub" -- --headless install --version 6000.1.6f1 --changeset d64b1a599cad --module ios --architecture arm64 --childModules

      - name: Activate Unity Personal License
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          /Applications/Unity/Hub/Editor/6000.1.6f1/Unity.app/Contents/Frameworks/UnityLicensingClient.app/Contents/MacOS/Unity.Licensing.Client \
            --activate-all \
            --include-personal \
            --username "$UNITY_EMAIL" \
            --password "$UNITY_PASSWORD"

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-iOS-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-iOS-

      - name: Export Xcode Project from Unity
        run: |
          /Applications/Unity/Hub/Editor/6000.1.6f1/Unity.app/Contents/MacOS/Unity \
            -batchmode \
            -nographics \
            -quit \
            -buildTarget iOS \
            -projectPath . \
            -executeMethod iOSBuildScript.Build \
            -logfile build_unity.log || (cat build_unity.log && exit 1)
          cat build_unity.log

      - name: Package Xcode to Unsigned IPA
        run: |
          cd build/iOS
          # Build archive with code signing disabled for sideloading
          xcodebuild -project Unity-iPhone.xcodeproj -scheme Unity-iPhone -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO -archivePath build/Unity-iPhone.xcarchive archive
          
          # Package into standard Payload .ipa format
          mkdir -p ../../output/Payload
          cp -r build/Unity-iPhone.xcarchive/Products/Applications/*.app ../../output/Payload/
          cd ../../output
          zip -r ARPaperToss.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ARPaperToss-iOS-IPA
          path: output/ARPaperToss.ipa
          retention-days: 14
